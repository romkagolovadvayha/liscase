apiVersion: v1
kind: Secret
metadata:
  name: liscase-secrets
  namespace: liscase
type: Opaque
stringData:
  # Database credentials (замените на реальные)
  DB_USERNAME: "root"
  DB_PASSWORD: "your-secure-password-here"
  
  # Cookie validation key
  COOKIE_VALIDATION_KEY: "your-cookie-validation-key-here"
  
  # S3/Cloud storage credentials
  S3_ACCESS_KEY: "your-s3-access-key"
  S3_SECRET_KEY: "your-s3-secret-key"
  
  # External API keys
  TELEGRAM_BOT_TOKEN: "your-telegram-bot-token"
  STEAM_API_KEY: "your-steam-api-key"
  
  # RCON passwords
  RCON_PASSWORD: "your-rcon-password"

---
# Шифрованные секреты (base64)
# Создайте с помощью: echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: liscase-db-credentials
  namespace: liscase
type: Opaque
data:
  username: cm9vdA==  # root (base64)
  password: cGFzc3dvcmQ=  # password (base64) - ЗАМЕНИТЕ НА РЕАЛЬНЫЙ!


