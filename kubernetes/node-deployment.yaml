apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-services
  namespace: liscase
  labels:
    app: node-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-services
  template:
    metadata:
      labels:
        app: node-services
    spec:
      containers:
      - name: discord
        image: your-registry/liscase-node:latest
        command: ['node', 'discord/index.js']
        envFrom:
        - configMapRef:
            name: liscase-config
        - secretRef:
            name: liscase-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
      
      - name: music-bot
        image: your-registry/liscase-node:latest
        command: ['node', 'music/index.js']
        envFrom:
        - configMapRef:
            name: liscase-config
        - secretRef:
            name: liscase-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: node-services
  namespace: liscase
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: node-services




