apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket
  namespace: liscase
  labels:
    app: websocket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket
  template:
    metadata:
      labels:
        app: websocket
    spec:
      containers:
      - name: websocket
        image: your-registry/liscase-app:latest
        command: ['php', 'yii', 'ws/start']
        ports:
        - containerPort: 8080
          name: websocket
        envFrom:
        - configMapRef:
            name: liscase-config
        - secretRef:
            name: liscase-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-service
  namespace: liscase
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: websocket
  selector:
    app: websocket

