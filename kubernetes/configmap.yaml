apiVersion: v1
kind: ConfigMap
metadata:
  name: liscase-config
  namespace: liscase
data:
  # PHP Configuration
  PHP_MEMORY_LIMIT: "512M"
  PHP_UPLOAD_MAX_FILESIZE: "128M"
  PHP_POST_MAX_SIZE: "128M"
  PHP_MAX_EXECUTION_TIME: "300"
  UPLOAD_MAX_SIZE: "128M"
  PHP_TIMEOUT: "300"
  
  # Application Configuration
  APP_ENV: "production"
  APP_DEBUG: "false"
  YII_ENV: "prod"
  RUN_MIGRATIONS: "true"
  
  # Domains Configuration
  FRONTEND_DOMAIN: "prostoj.store"
  BACKEND_DOMAIN: "e.prostoj.store"
  API_DOMAIN: "api.prostoj.store"
  FRONTEND_EN_DOMAIN: "en.prostoj.store"
  WS_DOMAIN: "ws.prostoj.store"
  
  # Database Configuration
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "prostoj4"
  DB_USERNAME: "root"
  
  # PHP-FPM Configuration
  PHP_FPM_HOST: "127.0.0.1"
  PHP_FPM_PORT: "9000"
  
  # WebSocket Configuration
  WS_HOST: "websocket-service"
  WS_PORT: "8080"
  WS_BACKEND_HOST: "127.0.0.1"
  WS_BACKEND_PORT: "4888"
  WS_READ_TIMEOUT: "2147483647s"
  WS_SEND_TIMEOUT: "2147483647s"
  WS_CONNECT_TIMEOUT: "60s"
  
  # Radio Configuration
  RADIO1_HOST: "127.0.0.1"
  RADIO1_PORT: "3007"
  RADIO2_HOST: "127.0.0.1"
  RADIO2_PORT: "3008"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Cache Configuration
  STATIC_CACHE_TIME: "30d"

