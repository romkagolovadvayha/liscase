<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг серверов</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎮 Мониторинг серверов</h1>
            <div class="header-info">
                <span id="lastUpdate">Загрузка...</span>
                <button id="refreshBtn" class="refresh-btn" title="Обновить">🔄</button>
            </div>
        </header>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Загрузка данных...</p>
        </div>

        <div id="error" class="error" style="display: none;">
            <p>❌ Ошибка загрузки данных</p>
            <button onclick="loadServers()">Повторить</button>
        </div>

        <div id="serversList" class="servers-list"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
