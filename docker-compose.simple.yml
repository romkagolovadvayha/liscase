# Упрощенная версия docker-compose для облачного деплоя
# Минимальная конфигурация без сложных инициализаций

services:
  php:
    image: yiisoftware/yii2-php:7.4-apache
    container_name: liscase-app
    depends_on:
      - redis
      - mysql
    volumes:
      - ./:/app
    ports:
      - '80:80'
    environment:
      - APACHE_DOCUMENT_ROOT=/app/frontend/web
      - REDIS_HOST=redis
      - DB_HOST=mysql
      - DB_NAME=liscase
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
    command: apache2-foreground

  redis:
    image: redis:7-alpine
    container_name: liscase-redis

  mysql:
    image: mysql:8.0
    container_name: liscase-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: liscase
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: liscase-phpmyadmin
    depends_on:
      - mysql
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}

volumes:
  mysql-data:

