<html>
<head>
    <style>
        body {
            padding: 10px;
        }
        .wrap {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        .test {
            cursor: pointer;
            padding: 10px;
            border: 2px solid rgba(0, 0, 0, 0.22);
            display: inline-block;
            background: rgba(0, 0, 0, 1);
            border-radius: 10px;
            transition: 0.3s;
        }
        .test:hover {
            background: rgba(0, 0, 0, 1);
        }
        .test:hover video {
            /*transform: scale(1.05);*/
        }
        .test video {
            transition: 0.3s;
            transform: scale(1);
        }
        .icon {
            width: 150px;
        }
        .test2 {
            cursor: pointer;
            padding: 10px;
            border: 2px solid rgba(0, 0, 0, 0.22);
            display: inline-block;
            background: rgba(0, 0, 0, 1);
            border-radius: 10px;
            transition: 0.3s;
        }
        .test2:hover {
            background: rgba(0, 0, 0, 1);
        }
        .test2 img {
            width: 150px;
            display: block;
        }
        .test2 .open {
            display: none;
        }
        .test2:hover .open {
            display: block;
        }
        .test2:hover .close {
            display: none;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="test">
        <video class="icon" muted preload playsinline>
            <source src="prostoiICON2.webm" type="video/webm">
        </video>
    </div>
    <div class="test2">
        <img class="close" src="closecase_izucheniya.png">
        <img class="open" src="opencase_izucheniya.png">
    </div>
</div>

<script>
    const videoPlayer = document.querySelector('.icon');
    let mouseover = false;
    var intervalRewind;
    videoPlayer.addEventListener('mouseover', () => {
        // clearInterval(intervalRewind);
        mouseover = true;
        videoPlayer.currentTime = 0;
        videoPlayer.playbackRate = 5.0;
        videoPlayer.play();
    });
    videoPlayer.addEventListener('mouseout', () => {
        mouseover = false;
        videoPlayer.playbackRate = 5.0;
        videoPlayer.play();
    });
    videoPlayer.addEventListener('timeupdate', (e) => {
        if (mouseover && videoPlayer.currentTime >= 0.2) {
            videoPlayer.pause();
        }
    });
    function rewind(rewindSpeed) {
        clearInterval(intervalRewind);
        var startSystemTime = new Date().getTime();
        var startVideoTime = videoPlayer.currentTime;

        intervalRewind = setInterval(function(){
            videoPlayer.playbackRate = 1.0;
            if(videoPlayer.currentTime === 0){
                clearInterval(intervalRewind);
                videoPlayer.pause();
            } else {
                var elapsed = new Date().getTime() - startSystemTime;
                videoPlayer.currentTime = Math.max(startVideoTime - elapsed * rewindSpeed/1000.0, 0);
            }
        }, 30);
    }
</script>
</body>
</html>
