<script>
    const videoPlayer = document.querySelector('.icon');
    let mouseover = false;
    var intervalRewind;
    videoPlayer.addEventListener('mouseover', () => {
        // clearInterval(intervalRewind);
        mouseover = true;
        videoPlayer.currentTime = 0;
        videoPlayer.playbackRate = 1.0;
        videoPlayer.play();
    });
    videoPlayer.addEventListener('mouseout', () => {
        mouseover = false;
        videoPlayer.playbackRate = 1.0;
        videoPlayer.play();
    });
    videoPlayer.addEventListener('timeupdate', (e) => {
        if (mouseover && videoPlayer.currentTime >= 1) {
            videoPlayer.pause();
        }
    });
    function rewind(rewindSpeed) {
        clearInterval(intervalRewind);
        var startSystemTime = new Date().getTime();
        var startVideoTime = videoPlayer.currentTime;

        intervalRewind = setInterval(function(){
            videoPlayer.playbackRate = 1.0;
            if(videoPlayer.currentTime === 0){
                clearInterval(intervalRewind);
                videoPlayer.pause();
            } else {
                var elapsed = new Date().getTime() - startSystemTime;
                videoPlayer.currentTime = Math.max(startVideoTime - elapsed * rewindSpeed/1000.0, 0);
            }
        }, 30);
    }
