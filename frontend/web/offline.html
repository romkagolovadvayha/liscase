<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Офлайн - LiSCase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            width: 100%;
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 30px;
            opacity: 0.8;
        }
        
        .offline-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        .offline-message {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .retry-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
        
        .features {
            margin-top: 40px;
            text-align: left;
        }
        
        .feature {
            margin: 15px 0;
            display: flex;
            align-items: center;
            opacity: 0.8;
        }
        
        .feature-icon {
            margin-right: 15px;
            font-size: 1.5rem;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .offline-icon {
            animation: pulse 2s infinite;
        }
        
        @media (max-width: 600px) {
            .offline-title {
                font-size: 2rem;
            }
            
            .offline-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📱</div>
        <h1 class="offline-title">Офлайн режим</h1>
        <p class="offline-message">
            Похоже, что у вас нет подключения к интернету. 
            Не волнуйтесь, некоторые функции приложения доступны и без сети.
        </p>
        
        <a href="/" class="retry-button" onclick="retryConnection()">
            Попробовать снова
        </a>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">💬</span>
                <span>Сообщения будут синхронизированы при восстановлении связи</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📋</span>
                <span>Доступ к кэшированным данным</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🔔</span>
                <span>Уведомления работают в фоне</span>
            </div>
        </div>
    </div>

    <script>
        function retryConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            } else {
                alert('Соединение с интернетом все еще отсутствует');
            }
        }
        
        // Проверяем подключение
        window.addEventListener('online', function() {
            window.location.href = '/';
        });
        
        // Показываем статус подключения
        if (navigator.onLine) {
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        }
    </script>
</body>
</html>
