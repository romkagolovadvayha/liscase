services:
  nginx:
    image: nginx:alpine
    container_name: liscase-nginx
    depends_on:
      - php
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./:/var/www/html:delegated
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - FRONTEND_DOMAIN=${FRONTEND_DOMAIN:-localhost}
      - BACKEND_DOMAIN=${BACKEND_DOMAIN:-backend.localhost}
      - API_DOMAIN=${API_DOMAIN:-api.localhost}

  php:
    image: php:7.4-fpm
    container_name: liscase-php
    depends_on:
      - redis
      - mysql
    volumes:
      - ./:/var/www/html:delegated
    expose:
      - '9000'
    environment:
      - APP_ENV=${APP_ENV:-development}
      - REDIS_HOST=redis
      - DB_HOST=mysql
      - DB_NAME=liscase
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - ADMIN_STEAM_ID=${ADMIN_STEAM_ID:-}
    command:
      - bash
      - -c
      - |
        echo '🚀 Starting LiSCase PHP-FPM server...'
        echo "   Environment: ${APP_ENV:-development}"
        
        # Установка необходимых расширений PHP
        echo '📦 Installing PHP extensions...'
        docker-php-ext-install pdo_mysql mbstring exif pcntl bcmath gd zip 2>/dev/null || echo '✅ Extensions already installed'
        
        # Установка Composer если нет
        if [ ! -f "/usr/local/bin/composer" ]; then
          echo '📦 Installing Composer...'
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        fi
        
        echo '📦 Installing Composer dependencies...'
        if [ ! -d '/var/www/html/vendor' ]; then
          cd /var/www/html
          COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --prefer-dist || echo 'Composer install failed'
        else
          echo '✅ Vendor directory exists, skipping composer install'
        fi
        
        echo '🔧 Initializing Yii application...'
        if [ ! -f '/var/www/html/frontend/config/main-local.php' ]; then
          cd /var/www/html
          echo '0' | php init --env=Development --overwrite=All
        else
          echo '✅ App already initialized, skipping'
        fi
        
        echo '📁 Creating runtime directories...'
        mkdir -p /var/www/html/frontend/runtime/cache /var/www/html/frontend/runtime/logs
        mkdir -p /var/www/html/backend/runtime/cache /var/www/html/backend/runtime/logs
        mkdir -p /var/www/html/api/runtime/cache /var/www/html/api/runtime/logs
        mkdir -p /var/www/html/console/runtime/cache /var/www/html/console/runtime/logs
        mkdir -p /var/www/html/frontend/web/uploads /var/www/html/backend/web/uploads
        mkdir -p /var/www/html/frontend/web/minify /var/www/html/backend/web/minify /var/www/html/api/web/minify
        mkdir -p /var/www/html/frontend/web/assets /var/www/html/backend/web/assets /var/www/html/api/web/assets
        
        echo '🔐 Setting permissions...'
        chmod -R 777 /var/www/html/frontend/runtime /var/www/html/backend/runtime /var/www/html/api/runtime /var/www/html/console/runtime 2>/dev/null || true
        chmod -R 777 /var/www/html/frontend/web/assets /var/www/html/frontend/web/uploads /var/www/html/frontend/web/minify 2>/dev/null || true
        chmod -R 777 /var/www/html/backend/web/assets /var/www/html/backend/web/uploads /var/www/html/backend/web/minify 2>/dev/null || true
        chmod -R 777 /var/www/html/api/web/assets /var/www/html/api/web/minify 2>/dev/null || true
        chown -R www-data:www-data /var/www/html 2>/dev/null || true
        
        echo '✅ Permissions configured'
        
        echo '⏳ Waiting for MySQL to be fully ready...'
        sleep 10
        MAX_TRIES=30
        COUNTER=0
        while [ $COUNTER -lt $MAX_TRIES ]; do
          if php -r "new PDO('mysql:host=mysql;port=3306', 'root', 'root');" 2>/dev/null; then
            echo '✅ MySQL is ready!'
            break
          fi
          COUNTER=$((COUNTER + 1))
          echo "   Waiting for MySQL ($COUNTER/$MAX_TRIES)..."
          sleep 2
        done
        
        echo '🗄️ Database already initialized from init.sql dump'
        echo 'ℹ️  To run migrations manually: docker-compose exec php php yii migrate'
        
        echo '🎨 Compiling SCSS styles...'
        cd /var/www/html
        php yii scss/compile 1 || echo '⚠️  SCSS compilation failed (continuing...)'
        
        echo '🔧 Updating settings (colors & cache)...'
        cd /var/www/html
        php yii settings/update || echo '⚠️  Settings update failed (continuing...)'
        
        echo '👤 Creating admin user from ADMIN_STEAM_ID...'
        cd /var/www/html
        if [ -n "$ADMIN_STEAM_ID" ]; then
          php yii admin/create "$ADMIN_STEAM_ID" || echo '⚠️  Admin creation failed (continuing...)'
        else
          echo 'ℹ️  ADMIN_STEAM_ID not set, skipping admin creation'
        fi
        
        echo '✅ Setup complete! Starting PHP-FPM...'
        php-fpm
  
  redis:
    image: redis:7-alpine
    container_name: liscase-redis
    ports:
      - '6379:6379'
  
  mysql:
    image: mysql:8.0
    container_name: liscase-mysql
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: liscase
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s
  
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: liscase-phpmyadmin
    depends_on:
      - mysql
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M

volumes:
  mysql-data:
