services:
  php:
    image: yiisoftware/yii2-php:7.4-apache
    container_name: liscase-dev
    depends_on:
      - redis
      - mysql
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '${APP_PORT:-80}:80'
    environment:
      - APACHE_DOCUMENT_ROOT=/app/frontend/web
      - APP_ENV=development
      - REDIS_HOST=redis
      - DB_HOST=mysql
      - DB_NAME=liscase
      - DB_USER=root
      - DB_PASSWORD=root
      - ADMIN_STEAM_ID=${ADMIN_STEAM_ID:-}
    command:
      - bash
      - -c
      - |
        echo '🚀 Starting LiSCase development server...'
        echo "   Environment: ${APP_ENV:-development}"
        echo "   Port: ${APP_PORT:-80} -> 80"
        
        echo '📦 Installing Composer dependencies...'
        if [ ! -d '/app/vendor' ]; then
          cd /app
          COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --prefer-dist || echo 'Composer already installed'
        else
          echo '✅ Vendor directory exists, skipping composer install'
        fi
        
        echo '🔧 Initializing Yii application...'
        if [ ! -f '/app/frontend/config/main-local.php' ]; then
          cd /app
          echo '0' | php init --env=Development --overwrite=All
        else
          echo '✅ App already initialized, skipping'
        fi
        
        echo '📁 Creating runtime directories...'
        mkdir -p /app/frontend/runtime/cache /app/frontend/runtime/logs
        mkdir -p /app/backend/runtime/cache /app/backend/runtime/logs
        mkdir -p /app/api/runtime/cache /app/api/runtime/logs
        mkdir -p /app/console/runtime/cache /app/console/runtime/logs
        mkdir -p /app/frontend/web/uploads /app/backend/web/uploads
        mkdir -p /app/frontend/web/minify /app/backend/web/minify /app/api/web/minify
        mkdir -p /app/frontend/web/assets /app/backend/web/assets /app/api/web/assets
        
        echo '🔐 Setting permissions...'
        chmod 777 /app/frontend/runtime /app/backend/runtime /app/api/runtime /app/console/runtime 2>/dev/null || true
        chmod 777 /app/frontend/web/assets /app/frontend/web/uploads /app/frontend/web/minify 2>/dev/null || true
        chmod 777 /app/backend/web/assets /app/backend/web/uploads /app/backend/web/minify 2>/dev/null || true
        chmod 777 /app/api/web/assets /app/api/web/minify 2>/dev/null || true
        chown www-data:www-data /app/frontend/web/minify /app/frontend/web/assets /app/frontend/web/uploads 2>/dev/null || true
        chown www-data:www-data /app/backend/web/minify /app/backend/web/assets /app/backend/web/uploads 2>/dev/null || true
        
        echo '✅ Permissions configured'
        
        echo '⏳ Waiting for MySQL to be fully ready...'
        sleep 10
        # Дополнительная проверка готовности MySQL
        for i in {1..30}; do
          if php -r "try { new PDO('mysql:host=mysql;port=3306', 'root', 'root'); exit(0); } catch (Exception \$e) { exit(1); }" 2>/dev/null; then
            echo '✅ MySQL is ready!'
            break
          fi
          echo "   Waiting for MySQL ($i/30)..."
          sleep 2
        done
        
        echo '🗄️ Database already initialized from init.sql dump'
        echo 'ℹ️  To run migrations manually: docker-compose exec php php yii migrate'
        
        echo '🎨 Compiling SCSS styles...'
        cd /app
        php yii scss/compile 1 || echo '⚠️  SCSS compilation failed (continuing...)'
        
        echo '🔧 Updating settings (colors & cache)...'
        cd /app
        php yii settings/update || echo '⚠️  Settings update failed (continuing...)'
        
        echo '👤 Creating admin user from ADMIN_STEAM_ID...'
        cd /app
        if [ -n "$ADMIN_STEAM_ID" ]; then
          php yii admin/create "$ADMIN_STEAM_ID" || echo '⚠️  Admin creation failed (continuing...)'
        else
          echo 'ℹ️  ADMIN_STEAM_ID not set, skipping admin creation'
        fi
        
        echo '⚙️ Configuring Apache Virtual Hosts...'
        
        # Frontend VirtualHost
        cat > /etc/apache2/sites-available/000-frontend.conf <<'EOF'
        <VirtualHost *:80>
            ServerAdmin webmaster@localhost
            ServerName localhost
            ServerAlias *.localhost
            DocumentRoot /app/frontend/web
            
            <Directory /app/frontend/web>
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
            </Directory>
            
            ErrorLog ${APACHE_LOG_DIR}/frontend-error.log
            CustomLog ${APACHE_LOG_DIR}/frontend-access.log combined
        </VirtualHost>
        EOF
        
        # Backend VirtualHost
        cat > /etc/apache2/sites-available/001-backend.conf <<'EOF'
        <VirtualHost *:80>
            ServerAdmin webmaster@localhost
            ServerName backend.localhost
            DocumentRoot /app/backend/web
            
            <Directory /app/backend/web>
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
            </Directory>
            
            ErrorLog ${APACHE_LOG_DIR}/backend-error.log
            CustomLog ${APACHE_LOG_DIR}/backend-access.log combined
        </VirtualHost>
        EOF
        
        # API VirtualHost
        cat > /etc/apache2/sites-available/002-api.conf <<'EOF'
        <VirtualHost *:80>
            ServerAdmin webmaster@localhost
            ServerName api.localhost
            DocumentRoot /app/api/web
            
            <Directory /app/api/web>
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
            </Directory>
            
            ErrorLog ${APACHE_LOG_DIR}/api-error.log
            CustomLog ${APACHE_LOG_DIR}/api-access.log combined
        </VirtualHost>
        EOF
        
        # Отключаем дефолтный сайт и включаем наши
        a2dissite 000-default 2>/dev/null || true
        a2ensite 000-frontend 001-backend 002-api
        a2enmod rewrite
        
        echo '✅ Setup complete! Starting Apache...'
        apache2-foreground
  
  redis:
    image: redis:7-alpine
    container_name: liscase-redis
    ports:
      - '6379:6379'
  
  mysql:
    image: mysql:8.0
    container_name: liscase-mysql
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: liscase
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s
  
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: liscase-phpmyadmin
    depends_on:
      - mysql
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M

volumes:
  mysql-data:
