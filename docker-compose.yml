version: '3.7'

services:
  # Сервис для PHP
  php:
    build: .  # Строим образ на основе Dockerfile
    image: php:7.4-fpm
    container_name: yii2_php
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: app_db
      DB_USER: user
      DB_PASSWORD: password
      FRONTEND_DOMAIN: site.ru
      BACKEND_DOMAIN: backend.site.ru
    volumes:
      - .:/application   # Монтируем директорию с кодом приложения
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini  # Поставьте свой php.ini, если необходимо
      - ./docker/supervisor/supervisord.conf:/etc/supervisord.conf  # Конфигурация Supervisor
    networks:
      - yii2_network
    depends_on:
      - mysql
      - redis
    deploy:
      resources:
        limits:
          cpus: "4"             # Увеличиваем процессор для PHP, так как это основное приложение
          memory: 6G            # Увеличиваем память для PHP
        reservations:
          cpus: "1"             # Минимум 1 процессор
          memory: 2G            # Минимум 2 ГБ памяти для стабильной работы

  # Сервис для Nginx
  nginx:
    image: nginx:latest
    container_name: yii2_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf  # Конфигурационный файл nginx
      - .:/application   # Монтируем директорию с кодом приложения
    networks:
      - yii2_network
    depends_on:
      - php
    deploy:
      resources:
        limits:
          cpus: "0.5"           # Nginx не требует много ресурсов, 0.5 ядра достаточно
          memory: 512M          # Для Nginx достаточно 512 МБ памяти
        reservations:
          cpus: "0.25"          # Минимум для стабильной работы
          memory: 256M          # Минимум 256 МБ памяти

  # Сервис для MySQL
  mysql:
    image: mysql:5.7
    container_name: yii2_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # Установите свой пароль
      MYSQL_DATABASE: app_db  # Название базы данных
      MYSQL_USER: user
      MYSQL_PASSWORD: password  # Установите пароль для пользователя
    volumes:
      - mysql_data:/var/lib/mysql  # Монтируем том для хранения данных MySQL
      - ./docker/mysql/dump.sql:/docker-entrypoint-initdb.d/dump.sql  # Монтируем дамп в init директорию
    networks:
      - yii2_network
    deploy:
      resources:
        limits:
          cpus: "1"             # 1 ядро для MySQL
          memory: 2G            # Выделяем 2 ГБ памяти для MySQL
        reservations:
          cpus: "0.5"           # Минимум для MySQL
          memory: 1.5G          # Минимум 1.5 ГБ памяти для стабильной работы

  # Сервис для Redis
  redis:
    image: redis:latest
    container_name: yii2_redis
    networks:
      - yii2_network
    deploy:
      resources:
        limits:
          cpus: "0.25"          # Redis не требует много процессора
          memory: 512M          # Для Redis достаточно 512 МБ памяти
        reservations:
          cpus: "0.1"           # Минимум 0.1 ядра
          memory: 256M          # Минимум 256 МБ памяти

  # Сервис для PhpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: yii2_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"  # Доступ к phpMyAdmin через порт 8080
    networks:
      - yii2_network
    depends_on:
      - mysql
    deploy:
      resources:
        limits:
          cpus: "0.25"          # PhpMyAdmin не требует много ресурсов
          memory: 512M          # Для PhpMyAdmin достаточно 512 МБ памяти
        reservations:
          cpus: "0.1"           # Минимум для работы
          memory: 256M          # Минимум 256 МБ памяти

networks:
  yii2_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local