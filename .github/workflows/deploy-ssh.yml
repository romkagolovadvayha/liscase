# Деплой на VPS по SSH (git pull + composer + миграции).
# Отдельно от deploy.yml (Kubernetes): этот workflow только для «голого» хоста.
#
# GitHub → Settings → Environments → **prostoj** и **moscow77** (имена как в матрице `environment:` ниже).
# У каждого окружения свои secrets/vars (хост, путь, ключи и т.д.).
#   SSH_HOST, SSH_USER, DEPLOY_PATH
#   SSH_PRIVATE_KEY или SSH_PRIVATE_KEY_B64 — только Secrets (не Variables)
#   SSH_KEY_PASSPHRASE — только если ключ с паролем (Secret)
#   DEPLOY_ENV — опционально: тело .env → заливается в DEPLOY_PATH/.env
#   DEPLOY_SUPERVISOR_CONF — опционально: содержимое одного .ini для Supervisor
#     (несколько [program:x] в одном файле). Заливается в /etc/supervisor/conf.d/
#   DEPLOY_SUPERVISOR_CONF_FILENAME — имя файла в conf.d (по умолчанию liscase.conf)
#
#   DEPLOY_CRONTAB — опционально: полное содержимое crontab для пользователя SSH (или root).
#     Полностью заменяет crontab этого пользователя — укажите все нужные строки (расписание + команда).
#     Турниры (рейтинг активных): */5 * * * * cd DEPLOY_PATH && YII_ENV=prod ./yii tournament/recalculate-rankings
#   DEPLOY_CRONTAB_ROOT — если 1 / true / yes: ставить через «sudo crontab» (crontab пользователя root).
#     Иначе: crontab текущего SSH_USER. Для root-варианта в sudoers нужен NOPASSWD на /usr/bin/crontab.
#   После установки crontab шлётся SIGHUP сервису cron/crond (systemctl kill), чтобы задания подхватились сразу.
#     При необходимости добавьте в sudoers NOPASSWD для systemctl (см. пример ниже).
#
# Для записи в /etc/supervisor/conf.d/ и supervisorctl пользователю SSH нужен sudo без пароля, например:
#   echo 'deploy ALL=(ALL) NOPASSWD:/usr/bin/mv,/bin/mv,/usr/bin/chmod,/bin/chmod,/usr/bin/supervisorctl,/usr/bin/crontab,/bin/systemctl,/usr/bin/systemctl' | sudo tee /etc/sudoers.d/deploy-supervisor
#   (подставьте имя пользователя вместо deploy; пути к бинарникам проверьте which mv chmod supervisorctl)
#
# На сервере: git, php, composer в PATH; в DEPLOY_PATH должен лежать уже сделанный git clone
# (ветку деплоя выставляет workflow). Если каталог создали только через SCP и .git нет:
#   либо один раз на сервере: git clone … в DEPLOY_PATH,
#   либо задайте DEPLOY_GIT_CLONE_URL (secret/var) — URL репозитория (git@… или https://…);
#     при отсутствии .git выполнится clone текущей ветки (github.ref_name) и слияние в DEPLOY_PATH
#     (файлы с раннего SCP, например .env.deploy, сохранятся).
# Пользователь SSH_USER должен иметь право git fetch (deploy key или credentials на сервере).

name: Deploy (SSH — VPS)

on:
  push:
    branches:
      - develop
      - main
      - master
      - prostoj
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-liscase-ssh-${{ github.ref }}-${{ matrix.environment }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        environment: [prostoj, moscow77]
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
      DEPLOY_PATH_REMOTE: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
      SSH_KEY_MATERIAL: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_PRIVATE_KEY || secrets.SSH_KEY }}
      SSH_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}

    steps:
      - name: Проверка переменных деплоя
        run: |
          missing=
          [ -z "${SSH_HOST:-}" ] && missing="$missing SSH_HOST"
          [ -z "${SSH_USER:-}" ] && missing="$missing SSH_USER"
          [ -z "${DEPLOY_PATH_REMOTE:-}" ] && missing="$missing DEPLOY_PATH"
          if [ -z "${SSH_KEY_MATERIAL:-}" ] && [ -z "${SSH_KEY_B64:-}" ]; then
            missing="$missing SSH_PRIVATE_KEY (или SSH_PRIVATE_KEY_B64)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Пусто:$missing"
            exit 1
          fi

      - name: Подготовить SSH-ключ (inline для appleboy)
        id: sshkey
        run: |
          set -euo pipefail
          if [ -n "${SSH_KEY_B64:-}" ]; then
            KEY_CONTENT=$(printf '%s' "$SSH_KEY_B64" | tr -d ' \n\r\t' | base64 -d)
          else
            KEY_CONTENT="$SSH_KEY_MATERIAL"
          fi
          if ! printf '%s\n' "$KEY_CONTENT" | head -1 | grep -q 'BEGIN'; then
            echo "::error::В SSH_PRIVATE_KEY должен быть приватный ключ (-----BEGIN … KEY-----)."
            exit 1
          fi
          {
            echo 'key<<EOF'
            printf '%s\n' "$KEY_CONTENT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          _key_file=$(mktemp)
          chmod 600 "$_key_file"
          printf '%s\n' "$KEY_CONTENT" > "$_key_file"
          if ssh-keygen -y -f "$_key_file" -P "" >/dev/null 2>&1; then
            echo "SSH_KEY_PASSPHRASE=" >> "$GITHUB_ENV"
          fi
          rm -f "$_key_file"

      - name: Собрать .env из DEPLOY_ENV
        id: prepenv
        env:
          ENV_BODY: ${{ secrets.DEPLOY_ENV || vars.DEPLOY_ENV }}
        run: |
          if [ -n "$ENV_BODY" ]; then
            printf '%s\n' "$ENV_BODY" > .env.deploy
            echo "has_env=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_env=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Залить .env на сервер
        if: steps.prepenv.outputs.has_env == '1'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ steps.sshkey.outputs.key }}
          passphrase: ${{ env.SSH_KEY_PASSPHRASE }}
          port: 22
          source: .env.deploy
          target: ${{ env.DEPLOY_PATH_REMOTE }}/

      - name: Собрать supervisor.deploy.conf из DEPLOY_SUPERVISOR_CONF
        id: prepsupervisor
        env:
          SUPERVISOR_BODY: ${{ secrets.DEPLOY_SUPERVISOR_CONF || vars.DEPLOY_SUPERVISOR_CONF }}
        run: |
          if [ -n "$SUPERVISOR_BODY" ]; then
            printf '%s\n' "$SUPERVISOR_BODY" > supervisor.deploy.conf
            echo "has_supervisor=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_supervisor=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Залить supervisor.deploy.conf на сервер
        if: steps.prepsupervisor.outputs.has_supervisor == '1'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ steps.sshkey.outputs.key }}
          passphrase: ${{ env.SSH_KEY_PASSPHRASE }}
          port: 22
          source: supervisor.deploy.conf
          target: ${{ env.DEPLOY_PATH_REMOTE }}/

      - name: Собрать deploy.crontab из DEPLOY_CRONTAB
        id: prepcron
        env:
          CRON_BODY: ${{ secrets.DEPLOY_CRONTAB || vars.DEPLOY_CRONTAB }}
        run: |
          if [ -n "$CRON_BODY" ]; then
            # Секрет с Windows/панели часто с CRLF — \r в конце строк ломает yii (runAction('sync\r')).
            printf '%s\n' "$CRON_BODY" | tr -d '\r' > deploy.crontab.raw
            python3 <<'PY'
          import os
          import re
          import shlex

          deploy_path = os.environ['DEPLOY_PATH_REMOTE'].rstrip('/')
          yii = shlex.quote(deploy_path + '/yii')

          def wrap(schedule: str, command: str, slug: str) -> str:
              lock = '/run/lock/liscase-' + re.sub(r'[^a-z0-9-]+', '-', slug.lower()).strip('-') + '.lock'
              return f"{schedule} /usr/bin/flock -n {lock} /bin/sh -lc {shlex.quote(command)}"

          source = open('deploy.crontab.raw', encoding='utf-8').read().splitlines()
          result = ['YII_ENV=prod', 'YII_DEBUG=0', 'MAILTO=""']
          seen = set()

          for line in source:
              stripped = line.strip()
              if not stripped or stripped.startswith('#'):
                  result.append(line)
                  continue
              if re.match(r'^(YII_ENV|YII_DEBUG|MAILTO)=', stripped):
                  continue

              parts = line.split(None, 5)
              if len(parts) < 6:
                  result.append(line)
                  continue
              schedule, command = ' '.join(parts[:5]), parts[5]

              if 'market.csgo.com/api/v2/prices/class_instance/RUB.json' in command:
                  if 'support/empty' in command and 'support/empty' not in seen:
                      result.append(wrap(schedule, f"cd {shlex.quote(deploy_path)} && php {yii} support/empty", 'support-empty'))
                      seen.add('support/empty')
                  result.append(wrap(schedule, f"cd {shlex.quote(deploy_path)} && php {yii} storage/refresh-price-file csmarket 1", 'prices-csmarket'))
                  seen.add('storage/refresh-price-file-csmarket')
                  continue

              if 'rust.tm/api/v2/prices/class_instance/RUB.json' in command:
                  result.append(wrap('*/5 * * * *', f"cd {shlex.quote(deploy_path)} && php {yii} storage/refresh-price-file rusttm", 'prices-rusttm'))
                  seen.add('storage/refresh-price-file-rusttm')
                  continue

              actions = re.findall(r'/yii\s+([a-z0-9_/-]+)', command, flags=re.I)
              seen.update(actions)
              if actions and '/usr/bin/flock ' not in command:
                  result.append(wrap(schedule, command, '-'.join(actions)))
              else:
                  result.append(line)

          if 'tournament/recalculate-rankings' not in seen:
              result.append(wrap('*/5 * * * *', f"cd {shlex.quote(deploy_path)} && php {yii} tournament/recalculate-rankings", 'tournament-rankings'))

          open('deploy.crontab', 'w', encoding='utf-8', newline='\n').write('\n'.join(result).rstrip() + '\n')
          PY
            rm -f deploy.crontab.raw
            echo "has_cron=1" >> "$GITHUB_OUTPUT"
          else
            echo "has_cron=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Залить deploy.crontab на сервер
        if: steps.prepcron.outputs.has_cron == '1'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ steps.sshkey.outputs.key }}
          passphrase: ${{ env.SSH_KEY_PASSPHRASE }}
          port: 22
          source: deploy.crontab
          target: ${{ env.DEPLOY_PATH_REMOTE }}/

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ steps.sshkey.outputs.key }}
          passphrase: ${{ env.SSH_KEY_PASSPHRASE }}
          port: 22
          # CREATE INDEX на statistics может идти часами; дефолт ssh-action — 10m
          command_timeout: 4h
          # true: drone-ssh вставляет exit после КАЖДОЙ строки — падает supervisorctl update (код 1) вопреки set +e
          script_stop: false
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${{ env.DEPLOY_PATH_REMOTE }}"
            cd "$DEPLOY_ROOT" || { echo "::error::Не удалось выполнить cd в DEPLOY_PATH=$DEPLOY_ROOT"; exit 1; }
            PHP_BIN='${{ secrets.DEPLOY_PHP_BIN || vars.DEPLOY_PHP_BIN }}'
            PHP_BIN="${PHP_BIN:-/opt/php85/bin/php}"
            if [ ! -x "$PHP_BIN" ]; then
              echo "::error::PHP 8.5 binary not found or not executable: $PHP_BIN"
              exit 1
            fi
            COMPOSER_BIN=$(command -v composer)
            # Do not inherit stale machine-wide GitHub OAuth credentials. Composer's
            # regular download cache remains available through its XDG cache path.
            export COMPOSER_HOME="$DEPLOY_ROOT/.composer-deploy"
            mkdir -p "$COMPOSER_HOME"
            "$PHP_BIN" -v
            BRANCH="${{ github.ref_name }}"
            DEPLOY_GIT_CLONE_URL='${{ secrets.DEPLOY_GIT_CLONE_URL || vars.DEPLOY_GIT_CLONE_URL }}'
            if [ ! -d .git ]; then
              if [ -z "${DEPLOY_GIT_CLONE_URL:-}" ]; then
                echo "::error::В DEPLOY_PATH нет .git — это не корень клона репозитория. На сервере выполните «git clone» в этот путь (частая ошибка: путь внутри другого сайта, куда SCP только создал подпапку). Либо задайте в GitHub Environment секрет/variable DEPLOY_GIT_CLONE_URL с URL репозитория для авто-клона при первом деплое."
                exit 1
              fi
              _d=$(mktemp -d)
              git clone --branch "$BRANCH" --single-branch "$DEPLOY_GIT_CLONE_URL" "$_d/checkout"
              cp -a "$_d/checkout"/. .
              rm -rf "$_d"
            fi
            if [ -f .env.deploy ]; then
              mv -f .env.deploy .env
            fi
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            # Без merge: локальные правки отслеживаемых файлов (например yii) ломали git pull (exit 128)
            git reset --hard "origin/$BRANCH"
            # yii в репозитории должен быть 100755; если в индексе был 100644 — chmod после деплоя
            chmod +x yii 2>/dev/null || true
            # rmrevin minify + API: логи в api/runtime/logs, опубликованные assets в api/web/assets
            mkdir -p frontend/web/minify backend/web/minify api/runtime/logs api/web/assets
            chmod 777 frontend/web/minify backend/web/minify api/runtime api/runtime/logs api/web/assets 2>/dev/null || true
            export YII_ENV=prod
            export YII_DEBUG=0
            "$PHP_BIN" "$COMPOSER_BIN" install --no-interaction --no-dev --optimize-autoloader
            "$PHP_BIN" -d default_socket_timeout=28800 yii migrate --interactive=0
            if [ -f supervisor.deploy.conf ]; then
              # Environment secrets edited on Windows may contain CRLF. Normalize first so
              # section-level validation below behaves identically on every target.
              tr -d '\r' < supervisor.deploy.conf > supervisor.deploy.conf.__lf__
              mv -f supervisor.deploy.conf.__lf__ supervisor.deploy.conf
              # Monitoring agents are optional. Do not leave permanent FATAL entries when
              # their binaries are not installed on a particular server.
              for _optional_program in loki promtail; do
                if [ ! -x "/usr/local/bin/${_optional_program}" ]; then
                  sed -i "/^\[program:${_optional_program}\]$/,/^$/d" supervisor.deploy.conf
                fi
              done
              # Keep the first of byte-identical duplicate program sections. Conflicting
              # duplicates are unsafe: fail before replacing the currently working config.
              awk -v RS='' -v ORS='\n\n' '
                /^\[program:/ {
                  name = $1
                  if (name in seen) {
                    if (body[name] != $0) exit 42
                    next
                  }
                  seen[name] = 1
                  body[name] = $0
                }
                { print }
              ' supervisor.deploy.conf > supervisor.deploy.conf.__deduplicated__
              mv -f supervisor.deploy.conf.__deduplicated__ supervisor.deploy.conf
              # Replace PHP both in direct commands (`command=php yii ...`) and
              # in wrapped commands (`command=bash -c '... /usr/bin/php ...'`).
              sed -i -E "s#(^|[=;&|[:space:]])(/usr/bin/php|/opt/php[0-9]+/bin/php|php)([[:space:]])#\\1${PHP_BIN}\\3#g" supervisor.deploy.conf
              sed -i -E 's/--verbose=1/--verbose=0/g' supervisor.deploy.conf
              python3 - "$DEPLOY_ROOT" "$PHP_BIN" <<'PY'
            import configparser
            import os
            import shlex
            import sys

            path, php = sys.argv[1], sys.argv[2]
            filename = 'supervisor.deploy.conf'
            parser = configparser.RawConfigParser(strict=True, interpolation=None)
            parser.optionxform = str
            parser.read(filename, encoding='utf-8')

            for section in parser.sections():
                if not section.startswith('program:'):
                    continue
                if parser.get(section, 'stopsignal', fallback='').upper() == 'KILL':
                    parser.set(section, 'stopsignal', 'TERM')
                if not parser.has_option(section, 'stopwaitsecs'):
                    parser.set(section, 'stopwaitsecs', '1250')
                parser.set(section, 'stdout_logfile_maxbytes', '20MB')
                parser.set(section, 'stdout_logfile_backups', '3')
                env = parser.get(section, 'environment', fallback='').strip()
                additions = ['YII_ENV="prod"', 'YII_DEBUG="0"']

                command = parser.get(section, 'command', fallback='')
                try:
                    argv = shlex.split(command)
                except ValueError:
                    argv = []
                if len(argv) >= 6 and os.path.basename(argv[1]) == 'multi-bot.js':
                    def quoted(key, value):
                        value = value.replace('\\', '\\\\').replace('"', '\\"')
                        return f'{key}="{value}"'
                    additions.extend([
                        quoted('DB_HOST', argv[2]),
                        quoted('DB_USER', argv[3]),
                        quoted('DB_PASSWORD', argv[4]),
                        quoted('DB_NAME', argv[5]),
                    ])
                    parser.set(section, 'command', ' '.join(argv[:2]))

                existing_keys = {item.split('=', 1)[0].strip() for item in env.split(',') if '=' in item}
                merged = [env] if env else []
                merged.extend(item for item in additions if item.split('=', 1)[0] not in existing_keys)
                parser.set(section, 'environment', ','.join(merged))

            queue_section = 'program:prostoj.queue-rustoteka-bot'
            if not parser.has_section(queue_section):
                parser.add_section(queue_section)
                parser.set(queue_section, 'command', f'{php} {path}/yii queue-rustoteka-bot/listen --verbose=0 --color=0')
                parser.set(queue_section, 'directory', path)
                parser.set(queue_section, 'environment', 'YII_ENV="prod",YII_DEBUG="0"')
                parser.set(queue_section, 'autostart', 'true')
                parser.set(queue_section, 'autorestart', 'true')
                parser.set(queue_section, 'startretries', '10')
                parser.set(queue_section, 'stopsignal', 'TERM')
                parser.set(queue_section, 'stopwaitsecs', '1250')
                parser.set(queue_section, 'numprocs', '1')
                parser.set(queue_section, 'redirect_stderr', 'true')
                parser.set(queue_section, 'stdout_logfile', f'{path}/console/runtime/supervisor/queue-rustoteka-bot.queue.log')
                parser.set(queue_section, 'stdout_logfile_maxbytes', '20MB')
                parser.set(queue_section, 'stdout_logfile_backups', '3')

            with open(filename, 'w', encoding='utf-8', newline='\n') as output:
                parser.write(output, space_around_delimiters=False)
            PY
              if grep -Eq '(^|[=;&|[:space:]])(/usr/bin/php|php)([[:space:]])' supervisor.deploy.conf; then
                echo "::error::Supervisor config still contains a legacy PHP command"
                exit 1
              fi
              SUPERVISOR_FN='${{ secrets.DEPLOY_SUPERVISOR_CONF_FILENAME || vars.DEPLOY_SUPERVISOR_CONF_FILENAME }}'
              SUPERVISOR_FN="${SUPERVISOR_FN:-liscase.conf}"
              sudo mv -f supervisor.deploy.conf "/etc/supervisor/conf.d/${SUPERVISOR_FN}"
              sudo chmod 600 "/etc/supervisor/conf.d/${SUPERVISOR_FN}"
              set +e
              sudo supervisorctl reread
              R=$?
              sudo supervisorctl update
              U=$?
              set -e
              if [ "$R" -ne 0 ] || [ "$U" -ne 0 ]; then
                echo "WARNING: supervisorctl reread=$R update=$U (деплой кода уже выполнен)"
              fi
            fi
            # crontab / HUP: не валим job при сбое sudo или systemctl
            set +e
            if [ -f deploy.crontab ]; then
              tr -d '\r' < deploy.crontab > deploy.crontab.__lf__ && mv -f deploy.crontab.__lf__ deploy.crontab
              sed -i -E "s#(^|[;&|[:space:]])(/usr/bin/php|/opt/php[0-9]+/bin/php|php)([[:space:]])#\\1${PHP_BIN}\\3#g" deploy.crontab
              CRON_ROOT='${{ secrets.DEPLOY_CRONTAB_ROOT || vars.DEPLOY_CRONTAB_ROOT }}'
              CRON_ROOT_NORM=$(printf '%s' "$CRON_ROOT" | tr '[:upper:]' '[:lower:]')
              if [ "$CRON_ROOT_NORM" = "1" ] || [ "$CRON_ROOT_NORM" = "true" ] || [ "$CRON_ROOT_NORM" = "yes" ]; then
                sudo crontab deploy.crontab
              else
                crontab deploy.crontab
              fi
              CE=$?
              rm -f deploy.crontab
              if [ "$CE" -ne 0 ]; then
                echo "WARNING: crontab install failed, code=$CE"
              fi
              for _cron_svc in cron crond; do
                if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet "$_cron_svc" 2>/dev/null; then
                  if sudo systemctl kill -s HUP "$_cron_svc" 2>/dev/null; then
                    break
                  fi
                fi
              done
            fi
            set -e
            true
