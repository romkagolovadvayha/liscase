name: Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
  KUBE_NAMESPACE: liscase

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata for main app
      id: meta-app
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/liscase-app
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push main app image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta-app.outputs.tags }}
        labels: ${{ steps.meta-app.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Node.js services image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/node/Dockerfile
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/liscase-node:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: '3.12.0'
    
    - name: Configure Kubernetes
      run: |
        mkdir -p $HOME/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
    
    - name: Add Helm repositories
      run: |
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
    
    - name: Update Helm dependencies
      run: |
        cd helm/liscase
        helm dependency update
    
    - name: Deploy to Kubernetes
      run: |
        helm upgrade --install liscase helm/liscase \
          --namespace ${{ env.KUBE_NAMESPACE }} \
          --create-namespace \
          --set image.repository=${{ env.DOCKER_REGISTRY }}/liscase-app \
          --set image.tag=latest \
          --set nodeImage.repository=${{ env.DOCKER_REGISTRY }}/liscase-node \
          --set nodeImage.tag=latest \
          --set mysql.auth.rootPassword=${{ secrets.MYSQL_ROOT_PASSWORD }} \
          --set mysql.auth.password=${{ secrets.MYSQL_PASSWORD }} \
          --set redis.auth.password=${{ secrets.REDIS_PASSWORD }} \
          --wait \
          --timeout 10m
    
    - name: Verify deployment
      run: |
        kubectl get pods -n ${{ env.KUBE_NAMESPACE }}
        kubectl get services -n ${{ env.KUBE_NAMESPACE }}
        kubectl get ingress -n ${{ env.KUBE_NAMESPACE }}
    
    - name: Run database migrations
      run: |
        POD=$(kubectl get pod -n ${{ env.KUBE_NAMESPACE }} -l app=liscase-app -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n ${{ env.KUBE_NAMESPACE }} $POD -- php yii migrate --interactive=0

    - name: Deployment summary
      run: |
        echo "✅ Deployment completed successfully!"
        echo "Frontend: https://prostoj.store"
        echo "Backend: https://backend.prostoj.store"



