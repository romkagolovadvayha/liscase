<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCON Панель Управления</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🎮 RCON</h2>
                <span class="status-indicator" id="statusIndicator">●</span>
            </div>
            
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <label class="sidebar-label">Выбор сервера</label>
                    <div id="serversList" class="sidebar-servers-list">
                        <div class="loading">Загрузка серверов...</div>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <button id="refreshBtn" class="btn btn-primary btn-block">🔄 Обновить</button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <header>
                <h1>RCON Панель Управления</h1>
            </header>

            <!-- Tabs -->
            <div class="tabs-container">
                <div class="tabs-header">
                    <button class="tab-btn active" data-tab="console">💻 Консоль</button>
                    <button class="tab-btn" data-tab="plugins">🔌 Плагины</button>
                    <button class="tab-btn" data-tab="history">📜 История команд</button>
                </div>

                <!-- Tab Content: Консоль -->
                <div class="tab-content active" id="tab-console">
                    <section class="console-section">
                        <div class="section-header">
                            <h2>💻 Консоль сервера</h2>
                            <div class="console-controls">
                                <button id="clearConsoleBtn" class="btn btn-secondary btn-sm">🗑️ Очистить</button>
                            </div>
                        </div>
                        <div id="consoleOutput" class="console-output">
                            <div class="console-placeholder">Выберите сервер в сайдбаре для просмотра консоли...</div>
                        </div>
                    </section>

                    <section class="command-section">
                        <h2>Отправка команды</h2>
                        <div class="command-form">
                            <div class="form-group">
                                <input type="text" id="commandInput" class="form-control" placeholder="Введите RCON команду...">
                                <div class="command-hints">
                                    <span class="hint" data-command="status">status</span>
                                    <span class="hint" data-command="players">players</span>
                                    <span class="hint" data-command="o.plugins">o.plugins</span>
                                    <span class="hint" data-command="serverinfo">serverinfo</span>
                                    <span class="hint" data-command="say">say</span>
                                </div>
                            </div>
                            <button id="sendBtn" class="btn btn-success">📤 Отправить</button>
                        </div>
                    </section>
                </div>

                <!-- Tab Content: Плагины -->
                <div class="tab-content" id="tab-plugins">
                    <section class="plugins-section">
                        <div class="section-header">
                            <h2>🔌 Плагины</h2>
                            <button id="loadPluginsBtn" class="btn btn-primary">🔄 Загрузить список</button>
                        </div>
                        <div id="pluginsList" class="plugins-list">
                            <div class="empty-state">Выберите сервер в сайдбаре для просмотра плагинов</div>
                        </div>
                    </section>
                </div>

                <!-- Tab Content: История команд -->
                <div class="tab-content" id="tab-history">
                    <section class="history-section">
                        <div class="section-header">
                            <h2>📜 История команд</h2>
                            <button id="refreshHistoryBtn" class="btn btn-secondary">🔄 Обновить</button>
                        </div>
                        <div id="historyList" class="history-list">
                            <div class="loading">Загрузка истории...</div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
