# Frontend Server
server {
    listen 80;
    server_name ${FRONTEND_DOMAIN} www.${FRONTEND_DOMAIN};
    root /var/www/html/frontend/web;
    index index.php index.html;

    charset utf-8;
    client_max_body_size ${UPLOAD_MAX_SIZE:-128M};

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript image/svg+xml;

    # Static files with caching
    location ~* ^.+\.(jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|webp|webm|woff|woff2|ttf)$ {
        expires ${STATIC_CACHE_TIME:-30d};
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        try_files $uri $uri/ =404;
    }

    # SVG with CORS
    location ~* \.svg$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;
            return 204;
        }
        expires ${STATIC_CACHE_TIME:-30d};
        add_header Access-Control-Allow-Origin "*" always;
    }

    # PHP processing
    location / {
        add_header Cache-Control "private, max-age=300";
        try_files $uri $uri/ /index.php?$args;
        
        location ~ [^/]\.ph(p\d*|tml)$ {
            try_files /does_not_exists @php;
        }
    }

    location @php {
        fastcgi_pass ${PHP_FPM_HOST:-127.0.0.1}:${PHP_FPM_PORT:-9000};
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout ${PHP_TIMEOUT:-300};
    }

    location ~ /\.(ht|svn|git) {
        deny all;
    }
}

