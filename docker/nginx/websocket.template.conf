# WebSocket Server Configuration
server {
    listen 80;
    server_name ${WS_DOMAIN:-ws.prostoj.store};

    charset utf-8;

    # WebSocket location
    location /ws/ {
        proxy_pass http://${WS_BACKEND_HOST:-127.0.0.1}:${WS_BACKEND_PORT:-4888};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        
        # WebSocket specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long-lived connections
        proxy_read_timeout ${WS_READ_TIMEOUT:-2147483647s};
        proxy_send_timeout ${WS_SEND_TIMEOUT:-2147483647s};
        proxy_connect_timeout ${WS_CONNECT_TIMEOUT:-60s};
    }

    # Radio 1
    location /radio1/ {
        proxy_pass http://${RADIO1_HOST:-127.0.0.1}:${RADIO1_PORT:-3007}/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 2147483647s;
        proxy_send_timeout 2147483647s;
    }

    # Radio 2
    location /radio2/ {
        proxy_pass http://${RADIO2_HOST:-127.0.0.1}:${RADIO2_PORT:-3008}/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 2147483647s;
        proxy_send_timeout 2147483647s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}




