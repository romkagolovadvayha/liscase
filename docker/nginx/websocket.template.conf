server {
    listen 80;
    server_name ${WS_DOMAIN};
    
    access_log /var/log/nginx/websocket-access.log;
    error_log /var/log/nginx/websocket-error.log;
    
    location /ws/ {
        proxy_pass http://${WS_BACKEND_HOST}:${WS_BACKEND_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout ${WS_READ_TIMEOUT};
        proxy_send_timeout ${WS_SEND_TIMEOUT};
        proxy_connect_timeout ${WS_CONNECT_TIMEOUT};
    }
}
