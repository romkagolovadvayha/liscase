[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# MariaDB Database Server
[program:mariadb]
command=/usr/bin/pidproxy /run/mysqld/mysqld.pid /usr/sbin/mariadbd --user=mysql --pid-file=/run/mysqld/mysqld.pid
autostart=true
autorestart=true
priority=1
user=root
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# Nginx Web Server
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# PHP-FPM
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F -R
autostart=true
autorestart=true
priority=5
user=root
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

# WebSocket Server
[program:websocket]
command=php /var/www/html/yii ws/start 3000
directory=/var/www/html
autostart=true
autorestart=true
priority=10
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/websocket.log
stderr_logfile=/var/log/supervisor/websocket_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=30
stopsignal=QUIT

# Queue Worker 1
[program:queue-worker-1]
command=php /var/www/html/yii queue/listen --verbose=1
directory=/var/www/html
autostart=true
autorestart=true
priority=15
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/queue-worker-1.log
stderr_logfile=/var/log/supervisor/queue-worker-1_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=60
stopsignal=TERM
startsecs=5

# Queue Worker 2
[program:queue-worker-2]
command=php /var/www/html/yii queue/listen --verbose=1
directory=/var/www/html
autostart=true
autorestart=true
priority=15
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/queue-worker-2.log
stderr_logfile=/var/log/supervisor/queue-worker-2_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=60
stopsignal=TERM
startsecs=5

# Queue Worker 3 (для тяжелых задач)
[program:queue-worker-heavy]
command=php /var/www/html/yii queue/listen --verbose=1 --isolate=1
directory=/var/www/html
autostart=true
autorestart=true
priority=20
user=www-data
numprocs=1
stdout_logfile=/var/log/supervisor/queue-worker-heavy.log
stderr_logfile=/var/log/supervisor/queue-worker-heavy_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopwaitsecs=120
stopsignal=TERM

# Cron Jobs через Supervisor
[program:cron-hourly]
command=php /var/www/html/yii cron/hourly
directory=/var/www/html
autostart=false
autorestart=false
user=www-data
stdout_logfile=/var/log/supervisor/cron-hourly.log
stderr_logfile=/var/log/supervisor/cron-hourly_error.log

[program:cron-daily]
command=php /var/www/html/yii cron/daily
directory=/var/www/html
autostart=false
autorestart=false
user=www-data
stdout_logfile=/var/log/supervisor/cron-daily.log
stderr_logfile=/var/log/supervisor/cron-daily_error.log

# Group для всех workers
[group:workers]
programs=queue-worker-1,queue-worker-2,queue-worker-heavy
priority=15

