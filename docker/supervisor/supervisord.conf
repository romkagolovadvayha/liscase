[supervisord]
nodaemon=true

[program:php-fpm]
command=/usr/local/sbin/php-fpm
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log

[program:redis]
command=redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/redis.err.log
stdout_logfile=/var/log/redis.out.log

[program:prostoj.queue-stats]
command=/usr/bin/php /application/yii queue-stats/listen --verbose=1 --color=0
autostart=true
autorestart=true
logfile=/var/log/supervisor/queue-stats.queue.log
startretries=10
stopsignal=KILL
numprocs=1

